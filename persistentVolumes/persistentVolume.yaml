apiVersion: v1
kind: PersistentVolume
metadata:
  name: winov-data
spec:
    capacity:
      storage: 2Gi
    accessModes:
      - ReadWriteMany
    persistentVolumeReclaimPolicy: Retain
    storageClassName: winov-data
    nfs:
      path: /nfs/winov-data
      server: 10.0.1.10
    volumeMode: Filesystem
